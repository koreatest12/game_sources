services:
  game-server:
    build:
      context: .
    image: game-sources:local
    container_name: game-sources-server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      FILE_STORAGE_DIR: /data/files
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      FILE_PUBLIC_DOWNLOADS: ${FILE_PUBLIC_DOWNLOADS:-false}
    expose:
      - "8080"
    volumes:
      - file_data:/data/files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  apache:
    build:
      context: ./deployment/apache
    image: game-sources-apache:local
    container_name: game-sources-apache
    restart: unless-stopped
    depends_on:
      game-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  file_data:
