name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  game-preflight:
    name: Astra Fly DOOM operational preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Validate Astra game JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check astra-fly-doom/game.js
          test -s astra-fly-doom/index.html
          test -s astra-fly-doom/styles.css
          grep -q '초파리 무한 DOOM' astra-fly-doom/index.html
          grep -q 'Q-Learning' astra-fly-doom/index.html
          grep -q 'LocalStorage\|localStorage' astra-fly-doom/game.js

      - name: Build Maven production JAR
        shell: bash
        run: |
          set -euo pipefail
          sh ./mvnw -B -ntp verify
          test -f target/game-sources.jar
          jar tf target/game-sources.jar | grep -q '^astra-fly-doom/index.html$'
          jar tf target/game-sources.jar | grep -q '^astra-fly-doom/styles.css$'
          jar tf target/game-sources.jar | grep -q '^astra-fly-doom/game.js$'

      - name: Run live Astra game smoke test
        shell: bash
        env:
          HOST: 127.0.0.1
          PORT: '18080'
          ADMIN_TOKEN: codeql-ci-token
          FILE_STORAGE_DIR: ${{ runner.temp }}/codeql-game-files
          MAX_UPLOAD_BYTES: '1048576'
          FILE_PUBLIC_DOWNLOADS: 'false'
          RUN_DIR: ${{ runner.temp }}/codeql-game-run
          LOG_FILE: ${{ runner.temp }}/codeql-game-server.log
        run: |
          set -euo pipefail

          rm -rf "$RUN_DIR" "$FILE_STORAGE_DIR"
          mkdir -p "$RUN_DIR" "$FILE_STORAGE_DIR"

          cleanup() {
            RUN_DIR="$RUN_DIR" PORT="$PORT" bash scripts/server-stop.sh >/dev/null 2>&1 || true
          }

          diagnostics() {
            echo '--- Astra game server log ---'
            cat "$LOG_FILE" 2>/dev/null || true
            echo '--- Listening TCP sockets ---'
            ss -ltnp 2>/dev/null || true
            echo '--- Java processes ---'
            ps -ef | grep '[j]ava' || true
          }

          on_exit() {
            status=$?
            if [[ "$status" -ne 0 ]]; then
              diagnostics
            fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT

          # Use the repository's common launcher. It verifies that the JVM stays
          # alive, waits for /ready, and prints the server log on startup failure.
          bash scripts/server-start.sh

          base_url="http://127.0.0.1:${PORT}"
          curl_retry=(
            curl
            --fail
            --silent
            --show-error
            --retry 5
            --retry-all-errors
            --retry-delay 1
            --connect-timeout 2
            --max-time 10
          )

          "${curl_retry[@]}" "$base_url/health" | grep -q '"status":"UP"'
          "${curl_retry[@]}" "$base_url/astra-fly-doom/" | grep -q '초파리 무한 DOOM'
          "${curl_retry[@]}" "$base_url/astra-fly-doom/game.js" | grep -q 'chooseAction'
          "${curl_retry[@]}" "$base_url/astra-fly-doom/styles.css" | grep -q 'game-panel'
          "${curl_retry[@]}" "$base_url/" | grep -q '/astra-fly-doom/'
          "${curl_retry[@]}" "$base_url/api/status" | grep -q '"astraFlyDoom":true'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: game-preflight
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'Manual build mode is not enabled for the current matrix.'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
