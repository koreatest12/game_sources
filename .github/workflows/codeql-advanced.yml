name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  game-preflight:
    name: Astra Fly DOOM operational preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Validate Astra game JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check astra-fly-doom/game.js
          test -s astra-fly-doom/index.html
          test -s astra-fly-doom/styles.css
          grep -q '초파리 무한 DOOM' astra-fly-doom/index.html
          grep -q 'Q-Learning' astra-fly-doom/index.html
          grep -q 'LocalStorage\|localStorage' astra-fly-doom/game.js

      - name: Build Maven production JAR
        shell: bash
        run: |
          set -euo pipefail
          sh ./mvnw -B -ntp verify
          test -f target/game-sources.jar
          jar tf target/game-sources.jar | grep -q '^astra-fly-doom/index.html$'
          jar tf target/game-sources.jar | grep -q '^astra-fly-doom/styles.css$'
          jar tf target/game-sources.jar | grep -q '^astra-fly-doom/game.js$'

      - name: Run live Astra game smoke test
        shell: bash
        env:
          HOST: 127.0.0.1
          PORT: '18080'
          ADMIN_TOKEN: codeql-ci-token
          FILE_STORAGE_DIR: ${{ runner.temp }}/codeql-game-files
          MAX_UPLOAD_BYTES: '1048576'
          FILE_PUBLIC_DOWNLOADS: 'false'
        run: |
          set -euo pipefail
          java -jar target/game-sources.jar >/tmp/astra-game-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS --connect-timeout 2 http://127.0.0.1:18080/health | grep -q '"status":"UP"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            cat /tmp/astra-game-server.log || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:18080/astra-fly-doom/ | grep -q '초파리 무한 DOOM'
          curl -fsS http://127.0.0.1:18080/astra-fly-doom/game.js | grep -q 'chooseAction'
          curl -fsS http://127.0.0.1:18080/astra-fly-doom/styles.css | grep -q 'game-panel'
          curl -fsS http://127.0.0.1:18080/ | grep -q '/astra-fly-doom/'
          curl -fsS http://127.0.0.1:18080/api/status | grep -q '"astraFlyDoom":true'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: game-preflight
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'Manual build mode is not enabled for the current matrix.'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
