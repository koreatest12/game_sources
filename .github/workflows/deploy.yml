name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_DOMAIN: ${{ secrets.PROD_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for name in PROD_HOST PROD_USER PROD_SSH_KEY PROD_DOMAIN ACME_EMAIL ADMIN_TOKEN; do
            test -n "${!name:-}" || { echo "Missing production secret: $name" >&2; exit 1; }
          done

      - name: Prepare SSH key
        env:
          PROD_SSH_KEY_VALUE: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY_VALUE" > "$HOME/.ssh/game_sources_deploy"
          chmod 600 "$HOME/.ssh/game_sources_deploy"

      - name: Deploy persistent production server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ runner.temp }}/../.ssh/game_sources_deploy
          DOMAIN: ${{ secrets.PROD_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          export PROD_SSH_KEY="$HOME/.ssh/game_sources_deploy"
          bash scripts/deploy-remote.sh

      - name: Verify public production service
        env:
          DOMAIN: ${{ secrets.PROD_DOMAIN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 6 --retry-delay 5 "https://$DOMAIN/health" | grep -q '"status":"UP"'
          curl --fail --show-error --silent "https://$DOMAIN/" | grep -q 'Game Sources Arena'
          curl --fail --show-error --silent -H "Authorization: Bearer $ADMIN_TOKEN" "https://$DOMAIN/metrics" | grep -q '"uptimeSeconds"'
