name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Warm Maven dependency cache
        run: sh ./mvnw -B -ntp dependency:go-offline

      - name: Verify and package
        run: sh ./mvnw -B -ntp verify

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          ruby -e 'require "yaml"; data=YAML.load_file("render.yaml"); abort("render.yaml: services missing") unless data.is_a?(Hash) && data["services"].is_a?(Array) && !data["services"].empty?'
          cat > /tmp/prod.env <<'EOF'
          DOMAIN=game.example.com
          ACME_EMAIL=ci@example.com
          ADMIN_TOKEN=ci-admin-token
          GAME_IMAGE=game-sources:prod
          JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
          MAX_UPLOAD_BYTES=1048576
          FILE_PUBLIC_DOWNLOADS=false
          SSH_PORT=22
          EOF
          ADMIN_TOKEN=ci-admin-token docker compose config >/tmp/compose.local.yml
          grep -q 'game-sources-apache' /tmp/compose.local.yml
          docker compose --env-file /tmp/prod.env -f deployment/compose.production.yml config >/tmp/compose.rendered.yml
          grep -q '/data/files' /tmp/compose.rendered.yml
          grep -q 'game-sources-apache' /tmp/compose.rendered.yml

          docker build -t game-sources-apache:ci deployment/apache
          docker run --rm game-sources-apache:ci httpd -t

          docker run --rm \
            -e DOMAIN=game.example.com \
            -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Run live JAR integration tests
        shell: bash
        env:
          ADMIN_TOKEN: ci-admin-token
          HOST: 0.0.0.0
          PORT: '8080'
          FILE_STORAGE_DIR: ${{ runner.temp }}/game-sources-files
          MAX_UPLOAD_BYTES: '1048576'
          FILE_PUBLIC_DOWNLOADS: 'false'
        run: |
          set -euo pipefail
          rm -rf "$FILE_STORAGE_DIR"
          bash scripts/server-start.sh
          trap 'PORT=8080 bash scripts/server-stop.sh || true' EXIT

          curl --retry 5 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/ | grep -q 'Game Sources Arena'
          curl -fsS http://127.0.0.1:8080/transfer.html | grep -q 'Game Sources File Transfer'
          curl -fsS http://127.0.0.1:8080/static/styles.css | grep -q 'game-card'
          curl -fsS http://127.0.0.1:8080/static/game.js | grep -q 'startGame'
          curl -fsS http://127.0.0.1:8080/static/transfer.js | grep -q 'uploadFile'
          curl -fsS http://127.0.0.1:8080/assets/player.svg | grep -q '<svg'
          curl -fsS http://127.0.0.1:8080/assets/enemy.svg | grep -q '<svg'
          curl -fsS http://127.0.0.1:8080/assets/gem.svg | grep -q '<svg'
          curl -fsS http://127.0.0.1:8080/assets/background.svg | grep -q '<svg'
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/ready | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/api/status | grep -q '"fileTransfer":true'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)" = "401"
          curl -fsS -H 'Authorization: Bearer ci-admin-token' http://127.0.0.1:8080/metrics | grep -q '"uptimeSeconds"'

          printf 'file-transfer-ci' > /tmp/transfer-ci.txt
          test "$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT -H 'Authorization: Bearer ci-admin-token' --data-binary @/tmp/transfer-ci.txt http://127.0.0.1:8080/api/files/transfer-ci.txt)" = "201"
          grep -q '"sha256"' /tmp/upload.json
          curl -fsS -H 'Authorization: Bearer ci-admin-token' http://127.0.0.1:8080/api/files | grep -q 'transfer-ci.txt'
          curl -fsS -H 'Authorization: Bearer ci-admin-token' http://127.0.0.1:8080/files/transfer-ci.txt | grep -q 'file-transfer-ci'
          test "$(curl -fsS -H 'Authorization: Bearer ci-admin-token' -H 'Range: bytes=0-3' http://127.0.0.1:8080/files/transfer-ci.txt)" = "file"
          curl -fsS -X DELETE -H 'Authorization: Bearer ci-admin-token' http://127.0.0.1:8080/api/files/transfer-ci.txt | grep -q '"deleted":true'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-admin-token' http://127.0.0.1:8080/files/transfer-ci.txt)" = "404"
          PORT=8080 bash scripts/server-status.sh

      - name: Build Docker server image
        run: docker build -t game-sources:ci .

      - name: Run live Docker + Apache integration tests
        shell: bash
        run: |
          set -euo pipefail
          docker volume create game-sources-ci-files >/dev/null
          docker network create game-sources-ci-net >/dev/null

          cleanup() {
            docker rm -f game-sources-apache-ci >/dev/null 2>&1 || true
            docker rm -f game-sources-ci >/dev/null 2>&1 || true
            docker network rm game-sources-ci-net >/dev/null 2>&1 || true
            docker volume rm game-sources-ci-files >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name game-sources-ci \
            --network game-sources-ci-net \
            --network-alias game-server \
            -e ADMIN_TOKEN=ci-admin-token \
            -e MAX_UPLOAD_BYTES=1048576 \
            -v game-sources-ci-files:/data/files \
            game-sources:ci

          docker run -d --name game-sources-apache-ci \
            --network game-sources-ci-net \
            -p 18080:8080 \
            game-sources-apache:ci

          healthy=0
          for attempt in {1..60}; do
            app_status=$(docker inspect --format='{{.State.Health.Status}}' game-sources-ci 2>/dev/null || true)
            apache_status=$(docker inspect --format='{{.State.Health.Status}}' game-sources-apache-ci 2>/dev/null || true)
            if [[ "$app_status" == "healthy" && "$apache_status" == "healthy" ]] \
              && curl -fsS --connect-timeout 2 http://127.0.0.1:18080/health | grep -q '"status":"UP"'; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != "1" ]]; then
            docker inspect game-sources-ci || true
            docker inspect game-sources-apache-ci || true
            docker logs game-sources-ci || true
            docker logs game-sources-apache-ci || true
            exit 1
          fi

          curl -fsSI http://127.0.0.1:18080/health | grep -qi '^Server: Apache'
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Game Sources Arena'
          curl -fsS http://127.0.0.1:18080/transfer.html | grep -q 'Game Sources File Transfer'
          curl -fsS http://127.0.0.1:18080/assets/background.svg | grep -q '<svg'
          curl -fsS http://127.0.0.1:18080/static/game.js | grep -q 'startGame'

          printf 'apache-docker-transfer' >/tmp/docker-transfer.txt
          curl -fsS -X PUT -H 'Authorization: Bearer ci-admin-token' --data-binary @/tmp/docker-transfer.txt http://127.0.0.1:18080/api/files/docker-transfer.txt | grep -q 'docker-transfer.txt'
          curl -fsS -H 'Authorization: Bearer ci-admin-token' http://127.0.0.1:18080/files/docker-transfer.txt | grep -q 'apache-docker-transfer'
          test "$(curl -fsS -H 'Authorization: Bearer ci-admin-token' -H 'Range: bytes=0-5' http://127.0.0.1:18080/files/docker-transfer.txt)" = "apache"
          test "$(docker inspect --format='{{.State.Health.Status}}' game-sources-ci)" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' game-sources-apache-ci)" = "healthy"

      - name: Build downloadable server bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/game-server
          cp target/game-sources.jar dist/game-server/
          cp Dockerfile compose.yml render.yaml README.md LICENSE dist/game-server/
          cp -R deployment scripts docs dist/game-server/
          chmod +x dist/game-server/scripts/*.sh
          tar -C dist -czf dist/game-server-bundle.tar.gz game-server
          (cd dist && sha256sum game-server-bundle.tar.gz > game-server-bundle.tar.gz.sha256)

      - name: Upload server bundle
        uses: actions/upload-artifact@v7
        with:
          name: game-server-bundle
          path: |
            dist/game-server-bundle.tar.gz
            dist/game-server-bundle.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
