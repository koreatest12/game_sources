version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:05"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(maven)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:15"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:25"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/deployment/apache"
    schedule:
      interval: "daily"
      time: "04:35"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(apache)"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:45"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(compose)"

  - package-ecosystem: "docker-compose"
    directory: "/deployment"
    schedule:
      interval: "daily"
      time: "04:55"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(prod-compose)"
